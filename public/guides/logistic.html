<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Guide - Logistic</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="/img/WebLogo.png" />
  <link rel="stylesheet" href="/css/global.css">
  <style>
    :root{
      --card: rgba(120, 35, 20, 0.65);
      --text-light: #fff3d6;
      --text-muted: #f7e4b8;
    }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    body{
      margin:0;
      background:url("/img/BlankBG.png") center/cover no-repeat fixed;
      color:var(--text-light);
    }
    main.page{
      max-width:900px;
      margin:90px auto 60px;
      padding:0 16px;
    }
    .article{
      background:var(--card);
      border-radius:14px;
      padding:18px;
      backdrop-filter:blur(3px);
    }
    h1{
      margin:0 0 12px;
      font-size:32px;
      font-weight:900;
      letter-spacing:0.18em;
      text-transform:uppercase;
      text-align:center;

      color:#fff3d6;
      text-shadow:
        0 2px 0 rgba(0,0,0,0.55),
        0 6px 12px rgba(0,0,0,0.35);
    }
    p{
      color:var(--text-muted);
      line-height:1.6;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <article class="article">
      <h1>LOGISTIC BASIC</h1>
      <p>Content will be added later.</p>
    </article>
  </main>

  <script src="/js/headerLoader.js" defer></script>
</body>
</html>
