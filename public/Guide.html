<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Guide</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="/img/WebLogo.png" />
  <link rel="stylesheet" href="/css/global.css">
  <style>
    :root{
      --card: rgba(120, 35, 20, 0.65);
      --text-light: #fff3d6;
      --text-muted: #f7e4b8;
    }
    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    html, body{ height:100%; }
    body{
      margin:0;
      background:url("/img/BlankBG.png") center/cover no-repeat fixed;
      color:var(--text-light);
    }
    main.page{
      max-width:900px;
      margin:70px auto 60px;
      padding:0 16px;
    }
    h1{
      margin:0 0 18px;
      font-size:32px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:0.18em;
      text-align:center;
      color:#8b1a10;
      text-shadow:
        0 2px 0 #f9e3b5,
        0 4px 6px rgba(0,0,0,0.35);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      background:var(--card);
      border-radius:14px;
      padding:14px 16px;
      backdrop-filter:blur(3px);
      border:1px solid rgba(255,255,255,0.10);
    }
    .card:hover{
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-1px);
    }
    .title{
      font-size:18px;
      font-weight:900;
      margin:0 0 6px;
    }
    .desc{
      margin:0;
      font-size:13px;
      color:var(--text-muted);
      line-height:1.35;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <h1 id="page-title">GUIDE</h1>
    <div id="guide-list" class="list"></div>
  </main>

  <script src="/js/headerLoader.js" defer></script>

  <script>
    const pageTitleTranslations = { en: "GUIDE", vi: "HƯỚNG DẪN" };

    const guides = [
      {
        slug: "labor",
        title: { en: "Labor Basics", vi: "Cơ chế Nhân lực" },
        desc: {
          en: "How population grows and how labor ratio affects all buildings.",
          vi: "Dân cư tăng như thế nào và nhân lực ảnh hưởng đến toàn bộ công trình ra sao."
        }
      },
      {
        slug: "factory",
        title: { en: "Factory Basics", vi: "Factory Cơ bản" },
        desc: {
          en: "How factories operate, required conditions, and labor interaction.",
          vi: "Nhà máy hoạt động ra sao, cần điều kiện gì và cách nhân lực tác động."
        }
      },
      {
        slug: "planning",
        title: { en: "Basic Planning", vi: "Quy hoạch Cơ bản" },
        desc: {
          en: "Why planning matters and how to build a stable city layout.",
          vi: "Vì sao cần quy hoạch và cách xây dựng một thành phố ổn định."
        }
      },
      {
        slug: "logistic",
        title: { en: "Logistics Basics", vi: "Logistic Cơ bản" },
        desc: {
          en: "Why logistics are essential and when to deploy them.",
          vi: "Vì sao logistic quan trọng và khi nào nên triển khai."
        }
      },
      {
        slug: "income",
        title: { en: "Income Basics", vi: "Thu nhập Cơ bản" },
        desc: {
          en: "Understanding income, expenses, and financial balance.",
          vi: "Hiểu về thu nhập, chi phí và cân bằng tài chính."
        }
      },
      {
        slug: "victory",
        title: { en: "Winning the Game", vi: "Làm sao để Chiến thắng" },
        desc: {
          en: "Victory and defeat conditions in Empire Run.",
          vi: "Điều kiện chiến thắng và thất bại trong Empire Run."
        }
      }
    ];


    function render(lang){
      document.getElementById("page-title").textContent =
        pageTitleTranslations[lang] || pageTitleTranslations.en;

      const host = document.getElementById("guide-list");
      host.innerHTML = "";

      guides.forEach(g => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `/guide/${g.slug}`;
        a.innerHTML = `
          <div class="title">${(g.title[lang] || g.title.en)}</div>
          <p class="desc">${(g.desc[lang] || g.desc.en)}</p>
        `;
        host.appendChild(a);
      });
    }

    window.addEventListener("languageChange", (e) => {
      const lang = (e.detail && e.detail.lang) || "en";
      render(lang);
    });

    document.addEventListener("DOMContentLoaded", () => {
      const lang = window.getCurrentLang ? window.getCurrentLang() : "en";
      render(lang);
    });
  </script>
</body>
</html>
